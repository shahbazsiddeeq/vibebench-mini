title: JWT Header Decoder (no validation)
description: decode_jwt_header(token) decodes and returns the header of a JWT token, which is its first '.'-separated segment, base64url-encoded. JWT segments omit base64 '=' padding, so the decoder must re-add padding before decoding. The decoded header must be a JSON object; the function returns it as a dict. Raises ValueError if the token has no '.', the segment is not valid base64url, the content is not valid JSON, or the decoded JSON is not an object (e.g. a list, number, or string). No signature verification is performed. Example: decode_jwt_header("eyJhbGciOiJIUzI1NiJ9.payload.sig") -> {"alg": "HS256"}
