title: CSV to SQLite Importer
description: 'csv_to_sqlite(csv_path, db_path, table_name) reads a CSV whose first line is the header, creates a new SQLite table whose columns are the header names (every column typed TEXT), inserts all data rows, and returns the number of rows inserted. table_name and every header name must be a valid identifier matching [A-Za-z_][A-Za-z0-9_]* and are double-quoted when interpolated; any name that is not a valid identifier raises ValueError (so a quote or other metacharacter in a header cannot inject SQL). Raises FileNotFoundError if csv_path does not exist, and ValueError if a table of that name already exists (the importer never appends to or overwrites an existing table). A CSV with only a header and no columns returns 0. Example: csv_to_sqlite("data.csv", "out.db", "records") -> 42'
