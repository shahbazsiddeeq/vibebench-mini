title: Non-Snake-Case Function Names
description: non_snake_case_functions(source) parses source with ast and returns, in source order (by line then column), the names of every function definition whose name does not match ^[a-z_][a-z0-9_]*$. This includes top-level functions, nested functions, async functions, and methods defined inside a class body; class names themselves are never checked, and dunder methods such as __init__ are snake_case so they are not reported. Raises ValueError on syntax errors. Example: defs myFunc, good_name, HTTPGet -> ['myFunc', 'HTTPGet']. Example: a class Widget with methods __init__, doThing, run -> ['doThing'].
