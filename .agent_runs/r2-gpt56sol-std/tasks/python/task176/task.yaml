title: Bounded Blocking Queue
description: "Implement a thread-safe FIFO class BoundedBlockingQueue(capacity: int) backed by stdlib threading only. __init__ raises ValueError if capacity < 1. Methods - put(item, timeout: float | None = None) -> bool blocks the calling thread while the queue holds capacity items and returns True once the item is enqueued, or returns False if timeout seconds elapse first without space becoming free (timeout=None waits forever, timeout=0 tries once without blocking); get(timeout: float | None = None) returns and removes the oldest item, blocking while the queue is empty, and raises TimeoutError if timeout seconds elapse first; size() -> int returns the current number of buffered items. Items leave in the exact order they were inserted, and a put that is blocked because the queue is full must unblock as soon as another thread calls get to free a slot. Example: q = BoundedBlockingQueue(1); q.put('a') returns True and size() is 1; a second thread calling q.put('b') blocks; once the first thread calls q.get() and receives 'a', the blocked put completes and returns True; q.get(timeout=0.1) on an empty queue raises TimeoutError."
