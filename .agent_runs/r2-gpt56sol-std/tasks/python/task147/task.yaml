description: "Implement parse_csv_line(line: str, delimiter: str = ',') -> list[str] that splits one RFC4180-style CSV record into fields. delimiter must be a single character other than '\"' (else raise ValueError). Fields are separated by delimiter, producing exactly (number of separating delimiters)+1 fields, so '' yields [''] and 'a,,b' yields ['a', '', 'b']. A field is QUOTED when its very first character (at the start of the line or immediately after a delimiter) is a double quote '\"'; then everything up to the next unescaped '\"' is its literal content, a doubled '\"\"' inside means one literal '\"', and the delimiter loses its special meaning inside the quotes. After a closing quote the next character must be a delimiter or end-of-line, otherwise raise ValueError; an unterminated quoted field also raises ValueError. In an UNQUOTED field a '\"' is an ordinary literal character. No trimming is done: all whitespace is preserved exactly, and matching is done on raw characters (Unicode-safe). Example: parse_csv_line('a,\"b,c\",\"d\"\"e\",') == ['a', 'b,c', 'd\"e', '']."
title: CSV Line Tokenizer (Quote-Aware)
