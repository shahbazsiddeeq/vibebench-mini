description: "parse_accept_language(value: str) -> list[tuple[str, float]] parses an HTTP Accept-Language header into a list of (language_tag, quality) pairs sorted by quality DESCENDING, with ties kept in their original left-to-right order (stable sort). The value is split on ',' into entries; each entry is 'lang-range' optionally followed by ';q=weight'. Surrounding whitespace around entries, tags, and the q-parameter is stripped. Empty entries (from doubled or trailing ',') are skipped. Language tags are LOWERCASED (the wildcard '*' is allowed and kept as '*'). The quality defaults to 1.0 when ';q=' is absent. The q-parameter key is matched case-insensitively ('q' or 'Q'); its value must be a number in the closed range 0..1 with at most three digits after the decimal point (e.g. '0', '1', '0.8', '0.001' are valid; '1.5', '0.0001', 'abc' are invalid -> ValueError). Entries with q=0 are DROPPED from the result (q=0 means 'not acceptable'). Each quality is returned as a Python float. An entry with an empty language tag, a malformed q-parameter, an unknown parameter name, or more than one ';' segment raises ValueError. The empty/whitespace-only header returns []. Return type is list[tuple[str, float]]. Example: parse_accept_language('en-US,en;q=0.9,fr;q=0.8,de;q=0') -> [('en-us', 1.0), ('en', 0.9), ('fr', 0.8)]."
title: Parse Accept-Language Q-Values
