title: Directory Hash (Deterministic)
description: dir_hash(path) returns a deterministic SHA-256 hex digest over the contents of a directory tree. Recursively collect every regular file under path, ignore directories themselves, and sort the files by their relative POSIX path (relative to path). For each file, feed into a single SHA-256 hash, in order, the byte length of the UTF-8 relative path followed by a colon, then the path bytes, then the byte length of the file content followed by a colon, then the content bytes. Return the hexdigest. The length-delimited framing guarantees two different trees cannot produce the same digest by shifting a path/content boundary. Raises ValueError if path is not a directory. The result is stable across runs and independent of filesystem iteration order. Worked example, an empty directory hashes to e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855 (the SHA-256 of the empty byte string).
