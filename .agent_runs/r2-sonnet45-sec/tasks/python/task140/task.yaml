title: Maximum Subarray (Kadane)
description: "max_subarray(nums: list[int]) -> tuple[int, int, int] finds the contiguous non-empty subarray of nums with the largest sum and returns (max_sum, start, end) where start and end are inclusive 0-based indices; handles negatives and all-negative arrays (the max may be a single element); tie-break when several subarrays share the maximum sum is smallest start index, then smallest end index (shortest); raises ValueError if nums is empty. Example: max_subarray([-2,1,-3,4,-1,2,1,-5,4]) -> (6, 3, 6)."
