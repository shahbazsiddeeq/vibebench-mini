description: "find_untyped_functions(source: str) -> list[tuple[str, int]] parses a string of Python source with the ast module and returns, for every function definition that is missing at least one required annotation, a tuple (function_name, lineno) where lineno is the 1-based line of the def/async def. A function is fully annotated only when it has a return annotation (the `-> T` after the parameter list) AND every one of its parameters is annotated, counting positional-only parameters, ordinary parameters, keyword-only parameters, the *args parameter, and the **kwargs parameter. The single exception is that the FIRST positional parameter of a method (a function defined directly in a class body) is exempt when it is named exactly `self` or `cls`; this exemption never applies to module-level functions or to functions nested inside other functions. Parameters that have default values still require annotations. Every def and async def is inspected, including methods, dunder methods, and nested inner functions; lambdas are ignored. A function is reported at most once even if several annotations are missing. Detection is by real parsing, so text inside strings or comments is irrelevant. The result is sorted ascending by (lineno, function_name). Raise ValueError if source is not valid Python (ast.parse raises SyntaxError). Example: find_untyped_functions('def add(a, b):\\n    return a + b\\ndef mul(a: int, b: int) -> int:\\n    return a * b') -> [('add', 1)] because add lacks parameter and return annotations while mul is fully annotated."
title: Missing Type Annotation Detector
