title: Deadlock-Free Bank Transfer
description: "Implement a thread-safe class Bank(balances: dict) that models accounts with integer balances, using stdlib threading only, with a per-account lock so unrelated accounts stay independently lockable. __init__ raises ValueError if any starting balance is negative. Method transfer(src, dst, amount) -> bool atomically moves amount units from account src to account dst: it raises KeyError if either account is unknown, ValueError if amount < 0 or if src == dst; it returns False without changing any balance when src holds fewer than amount units, otherwise it debits src, credits dst and returns True. Concurrent transfers among any accounts must never deadlock (acquire the two account locks in a fixed global order regardless of transfer direction) and must never lose or create money. Method balance(account) -> int returns one account's balance (KeyError if unknown) and total() -> int returns the summed balance of all accounts, which is invariant under any sequence of transfers. Example: bank = Bank({'a': 100, 'b': 0}); bank.transfer('a', 'b', 30) returns True with balance('a')==70 and balance('b')==30; bank.transfer('a', 'b', 1000) returns False and leaves balances unchanged; bank.transfer('a', 'a', 5) raises ValueError; total() stays 100 throughout."
