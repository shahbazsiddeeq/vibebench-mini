title: TODO/FIXME Marker Scanner
description: find_markers(source) returns (1-based line number, marker) for every line whose Python "#" comment text contains the marker 'TODO' or 'FIXME' (matched case-sensitively as a plain substring of the comment). A marker counts only when it appears inside an actual comment token - text inside string literals (even a string that itself contains a '#') is never reported, and lowercase 'todo'/'fixme' is ignored. If both markers appear on one line the one occurring first in the comment text wins; at most one result is produced per line, and results are ordered by line number. If the source cannot be fully tokenized (e.g. an unclosed bracket or string) the comments tokenized before the failure are still reported and nothing else is - there is no raw text fallback. Example: 'x = 1  # TODO fix' on line 1 -> [(1, 'TODO')].
