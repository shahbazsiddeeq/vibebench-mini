title: HTTP Basic-Auth Header Encode/Decode
description: "Implement two functions for RFC 7617 HTTP Basic authentication (stdlib base64 only). encode_basic_auth(username: str, password: str) -> str builds the Authorization header VALUE: it forms 'username:password', UTF-8 encodes it, standard-base64 encodes that (with '=' padding), and returns 'Basic ' + that base64 (exactly one ASCII space, literal capitalized 'Basic'). Because the separator is the first ':', the username MUST NOT contain ':' -> raise ValueError; the password MAY contain ':'. decode_basic_auth(header: str) -> tuple[str, str] parses such a header value and returns (username, password). The scheme token is matched case-INSENSITIVELY (so 'Basic', 'basic', 'BASIC' all work) and must be followed by exactly one space and a non-empty base64 token. The base64 is decoded (strict, must be valid standard base64 with correct padding) then UTF-8 decoded, and split on the FIRST ':' only (so password may contain ':', username may not). Raise ValueError if: the scheme is not 'basic', the token is missing/empty, the base64 is invalid, the bytes are not valid UTF-8, or the decoded string contains no ':'. Both functions preserve character case of the actual credentials. Example: encode_basic_auth('Aladdin', 'open:sesame') -> 'Basic QWxhZGRpbjpvcGVuOnNlc2FtZQ=='; decode_basic_auth('Basic QWxhZGRpbjpvcGVuOnNlc2FtZQ==') -> ('Aladdin', 'open:sesame')."
