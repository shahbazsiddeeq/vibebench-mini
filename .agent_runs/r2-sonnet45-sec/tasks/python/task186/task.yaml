title: Cyclomatic Complexity Analyzer
description: "compute_complexity(source: str) -> list[tuple[str, int, int]] parses a string of Python source with the ast module and returns, for every function definition, a tuple (function_name, lineno, complexity) where lineno is the 1-based line of the def/async def. Complexity starts at 1 and gains +1 for each of these decision points found in the function's OWN body: an if statement (each elif is itself an ast.If and so counts), a for or async for loop, a while loop, an except handler (ExceptHandler), a ternary IfExp expression, and each if-clause of a comprehension. Additionally, every boolean expression (ast.BoolOp for and / or) adds (number of operands - 1). The plain else block, the try/with/finally statements, and assert do NOT add anything. Each function is measured over its own body only: code inside a nested def, async def, lambda, or class is excluded and any nested def/async def is reported as its own separate entry. Every def and async def is inspected, including methods inside classes; lambdas are never reported. The result is sorted ascending by (lineno, function_name). Raise ValueError if source is not valid Python (ast.parse raises SyntaxError). Example: compute_complexity('def f(a):\\n    if a > 0:\\n        for i in range(a):\\n            if i % 2 == 0 and i > 1:\\n                print(i)\\n    return a') -> [('f', 1, 5)] because 1 (base) + 1 (outer if) + 1 (for) + 1 (inner if) + 1 (the and) = 5."
