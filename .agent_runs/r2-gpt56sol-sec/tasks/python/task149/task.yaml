title: Integer to English Words
description: "Implement number_to_words(n: int) -> str that spells a whole number in lowercase American English. Raise TypeError if n is not an int (bool is rejected too). The supported range is -999999999999 to 999999999999 inclusive; outside it raise ValueError. Zero returns exactly 'zero'. Negative numbers return 'negative ' followed by the words for the absolute value. Use the short scale with the words hundred, thousand, million, billion; no commas and no 'and' are used, three-digit groups are joined by single spaces, and the two-digit part 21-99 that is not a whole ten is hyphenated (e.g. 'twenty-one', 'forty-two'). There is no leading/trailing whitespace. Examples: number_to_words(0) == 'zero'; number_to_words(-42) == 'negative forty-two'; number_to_words(1234) == 'one thousand two hundred thirty-four'; number_to_words(1000000) == 'one million'; number_to_words(105) == 'one hundred five'."
