title: SQLite Upsert
description: 'upsert(db_path, table, record, key) inserts record into a SQLite table, or updates the existing row on a conflict of the key column. The key column must have a UNIQUE or PRIMARY KEY constraint (this is required for ON CONFLICT to fire). On conflict, every column in record other than key is overwritten with the new value, while columns not present in record are left unchanged; if record contains only the key, the existing row is left untouched. table, key, and all record keys must be valid identifiers matching [A-Za-z_][A-Za-z0-9_]*, are double-quoted when interpolated, and a value that is not a valid identifier raises ValueError. Values are always passed as bound parameters. Raises KeyError if key is not in record. Example: upsert("db.sqlite", "users", {"id": 1, "name": "Alice"}, "id")'
