title: Count-Down Latch
description: "Implement a thread-safe class CountDownLatch(count: int) that lets one or more threads wait until a set of operations completes. __init__ raises ValueError if count < 0. Methods - count_down() decrements the internal count by one but never below zero (calls once count is already 0 are no-ops); await_latch(timeout: float | None = None) -> bool blocks the calling thread until the count reaches 0 and returns True, or returns False if timeout seconds elapse first (timeout=None waits forever); get_count() -> int returns the current count. When the count transitions to 0 every currently-waiting thread must be released. The latch is one-shot: once at 0 it stays at 0 and all await_latch calls return True immediately. Example: latch = CountDownLatch(2); a worker calls latch.count_down() twice; a thread blocked in latch.await_latch() unblocks and returns True only after the second call; latch.await_latch(timeout=0.1) returns False while get_count() is still 1."