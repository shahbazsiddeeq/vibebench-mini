title: Unused Import Detector
description: unused_imports(source) parses source with ast and returns the bound names from import / from-import statements that are never referenced elsewhere as an ast.Name node, in source order. A reference only counts if it appears as a real Name in the code; a name that appears merely inside a string literal or a comment does NOT count as usage. The alias wins for 'as' forms and 'import a.b.c' binds 'a'; a star import ('from m import *') binds no inspectable name and is never reported. Raises ValueError on syntax errors. Example: 'import os\nimport sys\nprint(os.getcwd())' -> ['sys']. Example: 'import re\ns = "re.compile"' -> ['re'].
