title: Duration String Parser
description: "Implement parse_duration(text: str) -> int that converts a compact duration string into a total number of seconds (int). The string is one or more consecutive segments, each a non-negative integer written in ASCII digits followed immediately by a single lowercase unit character: 'w'=604800s (week), 'd'=86400s (day), 'h'=3600s (hour), 'm'=60s (minute), 's'=1s (second). Segments are simply summed, so units may appear in any order and may repeat (e.g. '1h30m' == 5400, '30m1h' == 5400, '1h1h' == 7200). No signs, decimal points, or whitespace are permitted anywhere, and units are case-sensitive (uppercase like 'H' is invalid). Raise ValueError for any input that does not fully match this grammar, including the empty string, a bare number with no unit, a unit with no number, an unknown unit letter, or any stray/whitespace character. Example: parse_duration('1h30m') == 5400 and parse_duration('2d') == 172800."
