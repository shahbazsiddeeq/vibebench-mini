title: Connected Components (Union-Find)
description: "connected_components(n: int, edges: list[tuple[int, int]]) -> list[list[int]] treats an undirected graph with nodes labeled 0..n-1 and the given edges and returns its connected components using union-find; each component is a sorted list of its node labels and the outer list is sorted by each component's smallest label; isolated nodes form singleton components and self-loops and duplicate edges are allowed and harmless; raises ValueError if n < 0 or if any edge endpoint is not in range(n). Example: connected_components(5, [(0,1),(1,2),(3,4)]) -> [[0,1,2],[3,4]]."
