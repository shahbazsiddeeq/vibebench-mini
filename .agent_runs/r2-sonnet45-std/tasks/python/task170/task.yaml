title: Parameterized Row Filter
description: "select_where(conn: sqlite3.Connection, table: str, filters: dict) -> list[tuple] runs SELECT * FROM <table> filtering rows where every key equals its value, combined with AND, and returns the resulting rows as a list of tuples (columns in the table's definition order) ordered by rowid ascending. All filter VALUES must be passed as bound parameters (never string-formatted). The table name and every filter key are IDENTIFIERS: each must match the regex ^[A-Za-z_][A-Za-z0-9_]*$ and is then wrapped in double quotes when built into SQL; if any identifier fails the regex, raise ValueError (this blocks SQL injection). An empty filters dict returns all rows. A filter value of None matches rows where that column IS NULL (uses `IS ?` semantics via `col IS NULL` when the value is None). Do not close the passed-in connection. Example: with table t(id, name, age) holding (1,'Ann',30),(2,'Bob',30),(3,'Cy',40), select_where(conn, 't', {'age': 30}) -> [(1,'Ann',30), (2,'Bob',30)]; select_where(conn, 't', {}) returns all three rows; select_where(conn, 't', {'name': \"x'; DROP\"}) returns [] (value is safely bound), whereas select_where(conn, 't', {'age; DROP TABLE t': 1}) raises ValueError."
