title: IPv4 CIDR Membership
description: "cidr_contains(cidr: str, ip: str) -> bool returns True iff the IPv4 address ip lies within the IPv4 block cidr (written as network/prefix, e.g. '192.168.1.0/24'). Parse strictly: cidr must have exactly one '/', each dotted-decimal octet must be an integer 0-255 written with no leading zeros (so '0' is valid but '00' and '007' are not), and the prefix length must be an integer 0-32 with no leading zeros. Host bits set in the network part are ignored: membership is computed by masking, i.e. (ip_int & mask) == (network_int & mask) where mask = (0xFFFFFFFF << (32 - prefix)) & 0xFFFFFFFF (prefix 0 gives mask 0 so everything matches, prefix 32 requires an exact match). Raise ValueError on any malformed cidr or ip: wrong octet count, octet out of range, leading-zero octet or prefix, missing/extra '/', non-integer prefix, or prefix > 32. Return type is bool. Example: cidr_contains('192.168.1.0/24', '192.168.1.42') -> True; cidr_contains('10.0.0.0/8', '11.0.0.1') -> False."
