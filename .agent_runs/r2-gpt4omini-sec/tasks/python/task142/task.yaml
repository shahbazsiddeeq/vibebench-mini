title: Dijkstra Shortest Distances
description: "dijkstra(graph: dict, start) -> dict maps every node reachable from start to its shortest-path distance from start using Dijkstra's algorithm; graph maps each node to a list of (neighbor, weight) pairs with non-negative integer weights, and a node that only appears as a neighbor is reachable but has no outgoing edges; start maps to 0, unreachable nodes are omitted; raises ValueError if start is not a key in graph or if any edge weight is negative. Example: dijkstra({'A': [('B',1),('C',4)], 'B': [('C',2)], 'C': []}, 'A') -> {'A': 0, 'B': 1, 'C': 3}."
