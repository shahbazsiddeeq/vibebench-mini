title: Parse Content-Type Header
description: "parse_content_type(value: str) -> tuple[str, dict[str, str]] parses an HTTP Content-Type (or media-type) header value into (media_type, params). The value is split into ';'-separated fields, but ';' characters INSIDE a double-quoted string do NOT split (quoted strings are honored). The FIRST field is the media type: it is stripped of surrounding whitespace and LOWERCASED, and must be 'type/subtype' with exactly one '/' and non-empty type and subtype (else ValueError). Each remaining field is a parameter 'name=value': the name is stripped and LOWERCASED; the value is stripped and, if it begins with '\"', is treated as an RFC-2616 quoted-string (surrounding double quotes removed and backslash escapes '\\\\x' -> 'x' unescaped) otherwise taken verbatim (an unquoted token value keeps its original case). Empty fields produced by doubled or trailing ';' are skipped. A parameter field with no '=' raises ValueError. Duplicate parameter names: the LAST occurrence wins. Parameter values keep their case; only the media type and parameter NAMES are lowercased. Return type is tuple[str, dict[str, str]] (empty dict when there are no parameters). Example: parse_content_type('Text/HTML; Charset=\"UTF-8\"; boundary=--x') -> ('text/html', {'charset': 'UTF-8', 'boundary': '--x'}); parse_content_type('multipart/form-data; name=\"a;b\"') -> ('multipart/form-data', {'name': 'a;b'})."
