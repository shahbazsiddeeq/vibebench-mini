title: Interval Merger
description: >-
  merge_intervals(intervals) takes a list of [start, end] pairs and returns the
  merged, non-overlapping intervals as a list of [start, end] lists, sorted by
  start (ascending). Two intervals are merged when they overlap or merely touch
  (i.e. one's start equals the other's end, such as [1,3] and [3,5] -> [1,5]).
  The input may be in any order and is empty-safe (an empty list returns []).
  Example: merge_intervals([[1,3],[2,6],[8,10],[15,18]]) -> [[1,6],[8,10],[15,18]]
