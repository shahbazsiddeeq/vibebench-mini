title: Chunked File Splitter and Joiner
description: "Two functions operating on raw bytes. split_file(path: str, chunk_size: int, dest_dir: str) -> list[str] reads the binary file at `path` and writes consecutive chunks of at most `chunk_size` bytes each into `dest_dir` (created with os.makedirs(exist_ok=True) if absent). Part i (starting at 0) is written to os.path.join(dest_dir, basename + '.part' + format(i, '03d')) where basename is os.path.basename(path); indices pad to at least 3 digits (part000, part001, ...). It returns the list of created part paths in order. An empty input file produces zero parts and returns []. Raises ValueError if chunk_size < 1; raises FileNotFoundError if `path` does not exist. join_files(parts: list[str], dest: str) -> int concatenates the raw bytes of each file in `parts`, in the given order, into a single new file at `dest`, and returns the total number of bytes written (an int). An empty `parts` list writes an empty file and returns 0. Raises FileNotFoundError if any part path does not exist. Round trip: join_files(split_file(p, n, d), out) recreates the exact original bytes of `p`. Example: for a file 'data.bin' holding b'ABCDE', split_file('data.bin', 2, 'out') writes b'AB', b'CD', b'E' and returns ['out/data.bin.part000','out/data.bin.part001','out/data.bin.part002']; join_files(that_list, 'restored.bin') writes b'ABCDE' and returns 5."
