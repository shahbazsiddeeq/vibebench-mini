title: Semaphore Resource Pool
description: "Implement a thread-safe class ResourcePool(capacity: int) that limits how many threads may hold a resource at once, using stdlib threading only. __init__ raises ValueError if capacity < 1. Methods - acquire(timeout: float | None = None) -> bool blocks the calling thread while all capacity permits are checked out and returns True once a permit is granted, or returns False if timeout seconds elapse first (timeout=None waits forever, timeout=0 tries once without blocking); release() returns one permit and must raise ValueError if called when no permits are currently checked out (i.e. it would push availability above capacity); available() -> int returns how many permits are currently free; slot(timeout: float | None = None) returns a context manager that acquires a permit on enter (raising TimeoutError if it cannot within timeout) and releases it on exit. At every instant the number of threads that have acquired but not yet released must never exceed capacity. Example: pool = ResourcePool(2); two threads each call acquire() and succeed, driving available() to 0; a third acquire(timeout=0.1) returns False; after one holder calls release(), available() is 1 and the next acquire() succeeds; calling release() once more than acquired raises ValueError."
