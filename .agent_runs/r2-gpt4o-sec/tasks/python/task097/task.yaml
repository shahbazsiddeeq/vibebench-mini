title: Z-Score Normalizer
description: z_scores(data) returns the list of z-scores (x-mean)/std for each element, where std is the population standard deviation (ddof=0). Results are not rounded. Raises ValueError if len(data)<2 or std==0. Example: z_scores([2,4,4,4,5,5,7,9]) -> [-1.5,-0.5,-0.5,-0.5,0.0,0.0,1.0,2.0]
