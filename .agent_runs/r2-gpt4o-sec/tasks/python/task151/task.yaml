title: Fixed-Width Record Parser
description: "parse_fixed_width(path: str, fields: list[tuple[str, int, int]]) -> list[dict[str, str]] reads the text file at `path` as UTF-8 using universal-newline mode (so '\\n', '\\r\\n', and '\\r' all terminate lines) and parses it as fixed-width records. Each `fields` entry is (name, start, length): a 0-based character offset and a character count. For every line, skip it if it is empty or contains only whitespace; otherwise build a dict where each field's value is line[start:start+length] with leading and trailing whitespace stripped (str.strip). Slicing past the end of a short line simply yields fewer characters (no error). Field order in the output dict follows the order of `fields`. Returns a list of these dicts, one per non-blank line, in file order. Raises FileNotFoundError if `path` does not exist. Raises ValueError if `fields` is empty or if any field has start < 0 or length < 1. Example: a file whose two lines are 'Alice  30NYC   ' and 'Bob    25LA    ' parsed with fields [('name',0,7),('age',7,2),('city',9,6)] returns [{'name':'Alice','age':'30','city':'NYC'}, {'name':'Bob','age':'25','city':'LA'}]."
