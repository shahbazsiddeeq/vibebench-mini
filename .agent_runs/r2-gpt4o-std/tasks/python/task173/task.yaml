title: Atomic Balance Transfer
description: "transfer(conn: sqlite3.Connection, table: str, id_column: str, balance_column: str, from_id, to_id, amount: int) -> tuple[int, int] atomically moves `amount` from the row whose id_column == from_id to the row whose id_column == to_id within a single transaction, and returns (new_from_balance, new_to_balance). All VALUES (from_id, to_id, amount) are passed as bound parameters. table, id_column and balance_column are IDENTIFIERS validated against ^[A-Za-z_][A-Za-z0-9_]*$ and double-quoted into the SQL (ValueError otherwise). Rules, each checked before any write: amount must be an int (not bool) and > 0 else ValueError; from_id and to_id must differ else ValueError; both rows must exist else ValueError('account not found'); the source balance must be >= amount else ValueError('insufficient funds'). On ANY failure after starting, the transaction is rolled back so balances are unchanged; on success it is committed. Use conn.execute for the two UPDATEs guarded by BEGIN/COMMIT (or conn as a context manager) so the debit and credit either both apply or neither does. Do not close the passed-in connection. Example: accounts(acct, bal) holding (1,100),(2,50); transfer(conn, 'accounts', 'acct', 'bal', 1, 2, 30) -> (70, 80) and persists; transfer(conn, 'accounts', 'acct', 'bal', 1, 2, 999) raises ValueError('insufficient funds') and leaves balances at 100 and 50."
