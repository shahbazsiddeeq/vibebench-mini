title: Detect Cycle (Next-Pointer Array)
description: has_cycle(sequence) treats the list as a next-pointer array where sequence[i] is the index that node i points to, or -1 meaning node i has no next node (end of the chain). Starting from index 0, follow the pointers and return True if a node is revisited (a cycle exists), or False if the chain reaches a -1 (no next node). An empty list returns False. Raises ValueError if any value is < -1 or >= len(sequence) (an out-of-bounds index). Examples: has_cycle([1,2,0]) -> True (0->1->2->0); has_cycle([1,2,-1]) -> False (0->1->2->end)
