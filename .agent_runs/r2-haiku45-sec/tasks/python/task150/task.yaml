title: Size-Based Log Rotator
description: "rotate_log(path: str, message: str, max_bytes: int, backup_count: int) -> None appends one log line to the file at `path`. The line written is message.encode('utf-8') followed by a single b'\\n' byte (written in binary, no newline translation). Let line_size be the length of those bytes. Before writing, if `path` already exists and is non-empty AND current_file_size + line_size > max_bytes, rotate first: if backup_count == 0, discard the current file (truncate to empty); otherwise delete path+'.'+str(backup_count) if present, then for i from backup_count-1 down to 1 rename path+'.'+str(i) to path+'.'+str(i+1) when it exists, then rename `path` to path+'.1'. After any rotation `path` no longer exists, so the new line starts a fresh file. If no rotation is needed, append the line (creating the file if absent). Rotation never happens when the current file is empty or missing, so a single oversized line is always written. Returns None. Raises ValueError if max_bytes < 1 or backup_count < 0. Example: starting with no file, rotate_log('app.log','hello',10,2) writes app.log = b'hello\\n'; then rotate_log('app.log','world',10,2) sees 6+6=12 > 10 so it renames app.log -> app.log.1 (now b'hello\\n') and writes app.log = b'world\\n'."
