title: Test Case Expander
description: expand_cases(base, overrides) returns a list with one new dict per override, where each result is base merged with that single override and the override's values win on key collisions. The merge is SHALLOW - for a key present in both, the override's value replaces the base's value outright, with no recursive merging of nested dicts. Each result is a fresh top-level dict (base is never mutated), and an empty overrides list yields an empty list. Example: expand_cases({'a':1,'b':2}, [{'b':9},{'a':7}]) -> [{'a':1,'b':9},{'a':7,'b':2}]. Example (shallow): expand_cases({'cfg':{'x':1}}, [{'cfg':{'y':2}}]) -> [{'cfg':{'y':2}}].
