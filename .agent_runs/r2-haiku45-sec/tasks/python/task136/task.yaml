title: Long Line Linter
description: long_lines(source, limit=79) returns the 1-based line numbers whose length in characters (excluding the line terminator) is strictly greater than limit. Lines are obtained with Python's str.splitlines(), so every boundary it recognizes splits a line - "\n", "\r", and "\r\n" (each a single terminator), plus form feed "\f", vertical tab "\v", and the other Unicode line boundaries; a tab "\t" is NOT a line boundary and counts as one character of length. Raises ValueError if limit < 1. Example: a 3-line source where line 2 has 100 chars -> [2]. Example: "abc\x0c" followed by 80 x's splits into two lines and returns [2].
