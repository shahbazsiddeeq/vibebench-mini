title: Mutable Default Argument Detector
description: "find_mutable_defaults(source: str) -> list[tuple[str, int]] parses a string of Python source with the ast module and returns, for every function definition that has at least one parameter whose default value is a mutable literal display, a tuple (function_name, lineno) where lineno is the 1-based line of the def/async def statement. A default counts as mutable if and only if its AST node is a list display ([...]/[]), a dict display ({...}/{}), or a set display ({1, 2}); tuple defaults, string/number/None/bool constants, and calls like list() or dict() do NOT count. Every def and async def is inspected, including methods inside classes and nested inner functions; lambdas are ignored. Both ordinary defaults and keyword-only defaults are checked. A function is reported at most once even if it has several mutable defaults. Occurrences of def(...) inside string literals or comments must be ignored (real parsing, not text search). The result is sorted ascending by (lineno, function_name). Raise ValueError if source is not valid Python (ast.parse raises SyntaxError). Example: find_mutable_defaults('def f(a, b=[]):\\n    pass\\ndef g(x={}):\\n    pass\\ndef h(y=(1, 2)):\\n    pass') -> [('f', 1), ('g', 3)]."
