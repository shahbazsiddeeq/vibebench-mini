title: Descriptive Statistics
description: describe(data) returns a dict with keys count, mean, median, mode, std_dev, min, max, range. All numeric values except count are rounded to 4 decimal places. std_dev is the population standard deviation (ddof=0), and is 0.0 for a single element. mode is the most frequent value; if several values tie for the highest frequency, the smallest such value is used; if every value is unique (no repeats), mode is None. Raises ValueError for empty data. Example: describe([1,2,2,3]) -> {"count":4, "mean":2.0, "median":2.0, "mode":2, "std_dev":0.7071, "min":1, "max":3, "range":2}.
