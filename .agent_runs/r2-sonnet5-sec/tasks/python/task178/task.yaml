title: Cyclic Phase Barrier
description: "Implement a reusable synchronization class PhaseBarrier(parties: int) using stdlib threading only. __init__ raises ValueError if parties < 1. Methods - wait(timeout: float | None = None) -> int blocks the calling thread until exactly parties threads have called wait for the current phase; when the last thread arrives every waiting thread is released together and the barrier automatically resets for the next phase. wait returns the arrival index for that phase, an integer 0..parties-1, where the first thread to arrive gets 0 and the thread that trips the barrier gets parties-1. If timeout seconds elapse before all parties arrive, the waiting thread raises TimeoutError and removes itself from the current phase's count (timeout=None waits forever). n_waiting() -> int returns how many threads are currently blocked in the present phase, and the attribute parties holds the configured party count. No thread may return from wait until all parties for that phase have arrived, and the barrier can be reused for an unbounded number of phases. Example: b = PhaseBarrier(3); two threads call b.wait() and block while n_waiting() is 2; when a third thread calls b.wait() all three unblock, having returned the indices 0, 1 and 2 in some arrival order; the same barrier then works again for the next phase."
