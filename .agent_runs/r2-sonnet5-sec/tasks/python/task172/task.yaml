title: Group-By Aggregator
description: "group_aggregate(conn: sqlite3.Connection, table: str, group_column: str, agg_column: str, agg: str = 'SUM') -> list[tuple] runs SELECT <group_column>, <AGG>(<agg_column>) FROM <table> GROUP BY <group_column> and returns a list of (group_value, aggregate_value) tuples ordered by group_value ascending with SQLite's default NULL-first ordering (so a NULL group, if present, comes first). agg is case-insensitive and must be one of SUM, AVG, MIN, MAX, COUNT; any other value raises ValueError (this is a whitelist, never string-substituted from arbitrary input). table, group_column and agg_column are IDENTIFIERS that must match ^[A-Za-z_][A-Za-z0-9_]*$ and are double-quoted into the SQL (ValueError otherwise). No user value is ever formatted into the SQL string. Do not close the passed-in connection. Example: with sales(region, amount) holding ('E',10),('E',5),('W',3),(NULL,7), group_aggregate(conn, 'sales', 'region', 'amount', 'SUM') -> [(None, 7), ('E', 15), ('W', 3)]; group_aggregate(conn, 'sales', 'region', 'amount', 'COUNT') -> [(None, 1), ('E', 2), ('W', 1)]; group_aggregate(conn, 'sales', 'region', 'amount', 'DROP') raises ValueError."
