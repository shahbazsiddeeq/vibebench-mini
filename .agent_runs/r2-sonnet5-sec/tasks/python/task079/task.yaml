title: Simple JSON Schema Validator
description: 'validate(data, schema) checks data against a schema dict with "required" (list of keys that must be present in data) and "types" (dict of key->type_name string). The legal type_name values are exactly "str", "int", "float", "bool", "list", and "dict" (mapping to the corresponding Python types). A "types" entry is only checked when the key is present in data; unknown type_name values are ignored. Returns a list of human-readable error messages, one per violation, and an empty list if data is valid. Example: validate({"x": 1}, {"required": ["x"], "types": {"x": "int"}}) -> []'
