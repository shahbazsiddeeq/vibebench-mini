title: SQLite Row Pagination
description: 'paginate(db_path, table, page, page_size) returns the rows for a 1-based page of an existing table (page 1 is the first page, offset = (page-1)*page_size), ordered by rowid, using LIMIT/OFFSET. Each row is returned as a plain tuple of its column values in table (SELECT *) order, and the result is a list of such tuples (empty list when the page is past the end). The table name must be a valid identifier ([A-Za-z_][A-Za-z0-9_]*). Raises ValueError for an invalid table name or page/page_size < 1. Example: with 5 rows, paginate("db.sqlite", "t", 2, 2) returns [row3, row4].'
