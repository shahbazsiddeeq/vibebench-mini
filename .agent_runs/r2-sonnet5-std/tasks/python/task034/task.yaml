title: Coin Change (Minimum Coins)
description: min_coins(coins, amount) returns the minimum number of coins (int) needed to make amount, where coins is a list of denominations, each available in unlimited supply (any denomination may be reused as many times as needed). Returns 0 when amount is 0. Returns -1 if the amount cannot be made from the given denominations (this includes the case of an empty coin list with amount>0). Raises ValueError if any coin<=0 or if amount<0. Example: min_coins([1,5,6,9], 11) -> 2 (using 5+6)
