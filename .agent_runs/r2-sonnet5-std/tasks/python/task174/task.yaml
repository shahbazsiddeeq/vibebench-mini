title: Bulk Row Updater
description: "bulk_update(conn: sqlite3.Connection, table: str, key_column: str, rows: list[dict]) -> int applies, for each dict in `rows`, an UPDATE <table> SET <col>=? ... WHERE <key_column>=? where the SET assignments come from the dict's entries other than key_column and the WHERE value is the dict's key_column value, running every update inside a single transaction, and returns the total number of rows modified (the sum of each statement's cursor.rowcount). All VALUES (the SET values and the key lookup value) are passed as bound `?` parameters, never string-formatted. table, key_column and every SET column name are IDENTIFIERS validated against ^[A-Za-z_][A-Za-z0-9_]*$ and double-quoted into the SQL (ValueError otherwise, which blocks SQL injection). rows must be a list; an empty list returns 0 and makes no changes. Each dict must contain key_column (else ValueError) and at least one other column to set (else ValueError). If any statement raises, the whole batch is rolled back so no partial update persists. Do not close the passed-in connection. Example: with users(id, name, age) holding (1,'Ann',30),(2,'Bob',25), bulk_update(conn, 'users', 'id', [{'id': 1, 'age': 31}, {'id': 2, 'name': 'Bobby', 'age': 26}]) -> 2 and persists (1,'Ann',31),(2,'Bobby',26); a dict with an injected column name like {'id': 1, 'age = 0 --': 5} raises ValueError."
