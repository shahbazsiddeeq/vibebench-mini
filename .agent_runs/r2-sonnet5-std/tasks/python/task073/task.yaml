title: SQLite Table Creator
description: 'create_table(db_path, table_name, columns) creates a SQLite table from a column-name->type-string dict. Table and column names must match the identifier pattern [A-Za-z_][A-Za-z0-9_]* and are double-quoted when interpolated; type strings may only contain letters, digits, underscores, spaces and parentheses (e.g. "INTEGER PRIMARY KEY", "VARCHAR(255)"). Raises ValueError if table_name or any column name is not a valid identifier, if a type string contains other characters, if columns is empty, or if a table with the same name already exists (comparison is case-insensitive, matching SQLite semantics). Example: create_table("db.sqlite", "users", {"id": "INTEGER PRIMARY KEY", "name": "TEXT"})'
