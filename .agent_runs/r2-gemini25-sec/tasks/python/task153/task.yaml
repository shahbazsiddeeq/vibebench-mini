title: Directory Checksum Manifest
description: "checksum_manifest(root: str) -> dict[str, str] walks the directory tree rooted at `root` and returns a manifest mapping each regular file's path (relative to `root`) to the lowercase hex SHA-256 digest of that file's raw bytes. Keys use POSIX '/' separators regardless of platform (os.sep is replaced with '/'), and the returned dict is ordered by key ascending (sorted). File contents are hashed by streaming the bytes in chunks so large files do not need to fit in memory. Symbolic links are not followed and directories themselves are not entries; only files reported by os.walk are hashed. An empty tree yields an empty dict. Raises FileNotFoundError if `root` does not exist, and NotADirectoryError if `root` exists but is not a directory. Example: for a directory containing an empty file named 'x', checksum_manifest returns {'x': 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'}; adding 'sub/a.txt' whose bytes are b'hello' adds the key 'sub/a.txt' -> '2cf24dba5fb0a30e26e83b2ac5b9e29e1b161e5c1fa7425e73043362938b9824'."
