title: Parse URL Query String
description: "parse_query_string(qs: str) -> dict[str, list[str]] parses a URL query string (WITHOUT any leading '?') into a dict mapping each decoded key to the ordered list of its decoded values. Pairs are separated by '&'; within a pair the key and value are split on the FIRST '=' only (so 'a=b=c' yields value 'b=c'). A segment with no '=' (e.g. 'flag') becomes that key with the empty-string value ''. A segment like 'a=' yields the empty-string value ''. Empty segments produced by leading/trailing/doubled '&' (e.g. '&&' or a trailing '&') are skipped entirely. Both keys and values are percent-decoded and '+' is decoded to a space (application/x-www-form-urlencoded rules, via urllib.parse.unquote_plus). Repeated keys are NOT overwritten: every value is appended to that key's list in the order it appears. Keys are kept case-sensitive (verbatim after decoding). The empty string qs '' returns {}. Malformed percent escapes are left as-is by unquote_plus and never raise. Return type is dict[str, list[str]]. Example: parse_query_string('a=1&a=2&b=&c') -> {'a': ['1', '2'], 'b': [''], 'c': ['']}; parse_query_string('x%20y=a+b') -> {'x y': ['a b']}."
