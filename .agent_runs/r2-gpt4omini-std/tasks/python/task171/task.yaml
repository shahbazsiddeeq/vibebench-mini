title: Safe Sort Query Builder
description: "fetch_sorted(conn: sqlite3.Connection, table: str, sort_column: str, allowed_columns: collection[str], descending: bool = False, limit: int | None = None) -> list[tuple] runs SELECT * FROM <table> ORDER BY <sort_column> [ASC|DESC] with an optional LIMIT and returns rows as a list of tuples (columns in the table's definition order). sort_column MUST be present in allowed_columns (membership check) OR the call raises ValueError; this whitelist is the primary defense so that only caller-approved columns can appear in ORDER BY. In addition, table and sort_column are IDENTIFIERS that must match ^[A-Za-z_][A-Za-z0-9_]*$ and are double-quoted when built into SQL (ValueError otherwise). Sort direction comes from the boolean descending (True -> DESC, False -> ASC); it is never taken from a string. limit, when not None, must be a non-negative int and is passed as a bound parameter (?); a negative or non-int limit raises ValueError. Do not close the passed-in connection. Ordering ties are broken by rowid ascending so results are deterministic. Example: with t(id, name, score) holding (1,'Ann',5),(2,'Bob',9),(3,'Cy',5), fetch_sorted(conn, 't', 'score', {'id','name','score'}, descending=True) -> [(2,'Bob',9),(1,'Ann',5),(3,'Cy',5)]; fetch_sorted(conn, 't', 'score', {'id','name','score'}, descending=True, limit=1) -> [(2,'Bob',9)]; fetch_sorted(conn, 't', 'password', {'id','name','score'}) raises ValueError."
