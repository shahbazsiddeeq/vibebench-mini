title: Glob Wildcard Matching
description: "Implement wildcard_match(pattern: str, text: str) -> bool that reports whether pattern matches the ENTIRE text (fully anchored: both ends must align). Two wildcards are recognized in pattern: '*' matches any run of zero or more characters, and '?' matches exactly one character. There is no escaping and no character classes: '*' and '?' are always wildcards even if you wanted them literal. Every other character must match the corresponding text character exactly. Matching is case-sensitive and operates on Unicode code points, so '?' matches exactly one code point. An empty pattern matches only empty text; a pattern of just '*' matches any text including the empty string. Return a bool (never raise for ordinary str inputs). Examples: wildcard_match('a*c?', 'abbcx') == True; wildcard_match('*.txt', 'file.txt') == True; wildcard_match('a?c', 'ac') == False; wildcard_match('', '') == True."
