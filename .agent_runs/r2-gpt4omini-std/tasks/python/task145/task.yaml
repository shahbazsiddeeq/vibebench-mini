title: Template Placeholder Substitution
description: "Implement render_template(template: str, values: dict) -> str that substitutes placeholders in template. A placeholder is '{name}' where name is one or more ASCII letters, digits, or underscores (regex [A-Za-z0-9_]+); it is replaced by str(values[name]). The literal sequence '{{' produces a single '{' and '}}' produces a single '}'. Scanning is strictly left-to-right and case-sensitive; every other character (including non-ASCII/Unicode) is copied verbatim. Raise KeyError(name) if a valid placeholder's name is not a key in values. Raise ValueError if a '{' is not part of '{{' nor a valid '{name}' (this includes empty '{}', a name with an illegal character, or an unterminated '{name'), or if a '}' is not part of '}}' and does not close a placeholder. An empty template returns ''. Example: render_template('Hi {name}, {{100%}} done', {'name': 'Al'}) == 'Hi Al, {100%} done'."
