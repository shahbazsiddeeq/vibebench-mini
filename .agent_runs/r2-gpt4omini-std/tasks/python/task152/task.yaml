description: "parse_dotenv(path: str) -> dict[str, str] parses a .env file (UTF-8) into a dict. Process the file line by line. Strip each line; skip it if it is empty or if it begins with '#' (a full-line comment). Remove an optional leading 'export ' prefix. Split the remaining text on the FIRST '=' into key and raw value; if there is no '=', raise ValueError. The key is the text left of '=' stripped; raise ValueError if it is empty or does not match the regex [A-Za-z_][A-Za-z0-9_]*. Determine the value from the raw right-hand side (before any whitespace stripping) as follows: if it starts and ends with a double quote (\"), drop the quotes and unescape the sequences \\n, \\t, \\r, \\\\ and \\\" (no inline-comment stripping); if it starts and ends with a single quote ('), drop the quotes and take the contents literally; otherwise it is unquoted, so first strip an inline comment (the value ends just before the first '#' that is at index 0 or immediately preceded by whitespace), then strip surrounding whitespace. Later duplicate keys overwrite earlier ones. Returns the resulting dict. Raises FileNotFoundError if `path` does not exist. Example: a file with lines 'export NAME=\"Alice\"', \"GREETING=\\\"hi\\\\nthere\\\"\", \"PORT=8080  # the port\" and 'RAW=a#b' returns {'NAME':'Alice', 'GREETING':'hi\\nthere', 'PORT':'8080', 'RAW':'a#b'} where GREETING contains a real newline character."
title: Dotenv File Parser
