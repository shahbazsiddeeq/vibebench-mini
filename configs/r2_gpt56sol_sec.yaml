# CodeAssay PROFES revision R2 (regeneration at a common output-token limit).
# Model: gpt-5.6-sol   Prompt: secure
# Writes to .agent_runs/r2-gpt56sol-sec/ -- the v1 run .agent_runs/gpt56sol-sec/ is not touched.
# Per-call finish reasons / token usage -> .agent_runs/r2-gpt56sol-sec/events.jsonl
# Settings snapshot                     -> .agent_runs/r2-gpt56sol-sec/runinfo.json
# Attempt-1 programs (pre-repair)       -> .agent_runs/r2-gpt56sol-sec/cache/attempt1/
agents:
  - name: r2-gpt56sol-sec
    kind: python
    cmd: python scripts/agents/openai_agent.py --task {task_dir} --tests {test_file} --cache {run_root}/cache --repair-once --model gpt-5.6-sol --prompt-variant secure
