# CodeAssay PROFES revision run (split-aware; grades on hidden). Model: gpt-5.6-sol
agents:
  - name: gpt56sol-std
    kind: python
    cmd: python scripts/agents/openai_agent.py --task {task_dir} --tests {test_file} --cache {run_root}/cache --repair-once --model gpt-5.6-sol
  - name: gpt56sol-sec
    kind: python
    cmd: python scripts/agents/openai_agent.py --task {task_dir} --tests {test_file} --cache {run_root}/cache --repair-once --model gpt-5.6-sol --prompt-variant secure
