# CodeAssay PROFES revision run (split-aware; grades on hidden). Model: gpt-4o-mini
agents:
  - name: gpt4omini-std
    kind: python
    cmd: python scripts/agents/openai_agent.py --task {task_dir} --tests {test_file} --cache {run_root}/cache --repair-once --model gpt-4o-mini
  - name: gpt4omini-sec
    kind: python
    cmd: python scripts/agents/openai_agent.py --task {task_dir} --tests {test_file} --cache {run_root}/cache --repair-once --model gpt-4o-mini --prompt-variant secure
