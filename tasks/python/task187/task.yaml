title: Bare Except Clause Finder
description: "find_bare_excepts(source: str) -> list[int] parses a string of Python source with the ast module and returns the sorted-ascending list of 1-based line numbers of every bare except clause, that is, every ast.ExceptHandler whose type attribute is None (written as `except:`). Handlers that name an exception do NOT count: `except Exception:`, `except (ValueError, KeyError):`, and `except OSError as e:` are all fine and are never reported. Every except handler in the module is inspected, including handlers in try statements nested inside functions, classes, loops, with-blocks, and other try statements. Detection is by real parsing, so the text `except:` appearing inside a string literal or a comment is ignored. Each bare handler contributes exactly one line number (its own lineno). Raise ValueError if source is not valid Python (ast.parse raises SyntaxError). Example: find_bare_excepts('try:\\n    risky()\\nexcept ValueError:\\n    pass\\nexcept:\\n    pass') -> [5] because only the handler on line 5 is bare."
